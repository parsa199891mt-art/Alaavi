<!-- admin.html -->
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>ورود ادمین | مدرسه علوی</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-box">
  <h2>ورود ادمین</h2>

  <input id="password" type="password" placeholder="رمز عبور">

  <!-- خیلی مهم -->
  <button type="button" onclick="login()">ورود</button>
</div>

<div id="panel" class="admin-panel" style="display:none">
  <h3>پنل مدیریت</h3>

  <input id="albumName" placeholder="نام آلبوم">
  <input type="file" id="imageFile" accept="image/*">
  <button type="button" onclick="uploadImage()">آپلود عکس</button>
</div>

<footer>
  تمام حقوق این سایت متعلق به محمد پارسا ولیان است
</footer>

<!-- JS حتما آخر body -->
<script src="js/admin.js"></script>
</body>
</html>
