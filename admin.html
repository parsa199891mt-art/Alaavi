<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>پنل مدیریت | مدرسه علوی</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="admin-page">

<div class="admin-card" id="loginBox">
  <h2>ورود مدیر</h2>
  <input type="password" id="password" placeholder="رمز عبور">
  <button onclick="login()">ورود</button>
</div>

<div class="admin-card hidden" id="adminPanel">
  <h2>مدیریت گالری</h2>

  <select id="albumSelect"></select>
  <input type="text" id="newAlbum" placeholder="آلبوم جدید">
  <input type="file" id="imageFile" accept="image/*">

  <button onclick="uploadImage()">افزودن تصویر</button>
  <button class="danger" onclick="deleteLast()">حذف آخرین عکس</button>
  <button class="danger" onclick="deleteAlbum()">حذف آلبوم</button>
</div>

<footer class="site-footer">
  تمام حقوق این سایت متعلق به محمد پارسا ولیان است
</footer>

<script src="js/admin.js"></script>
</body>
</html>
